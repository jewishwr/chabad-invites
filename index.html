<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15223f">
<title>Chabad Invites</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5efe1; --surface:#fffcf4; --surface-2:#efe7d4; --ink:#1a2238; --muted:#646a79; --line:#e4dac4;
  --hero:#15223f; --hero-ink:#f6efdc; --hero-muted:#b9bfd0; --hero-line:rgba(246,239,220,.22);
  --gold:#c9a238; --gold-ink:#7a5c10; --on-gold:#1d1604;
  --primary:#15223f; --primary-ink:#fbf6e8;
  --c-yes:#2c7a4b; --b-yes:#dcefe2;
  --c-maybe:#8f6206; --b-maybe:#f6e8c4;
  --c-sent:#2d5893; --b-sent:#dfe8f5;
  --c-todo:#5f6574; --b-todo:#e9e3d5;
  --c-no:#9e3f38; --b-no:#f4dfdb;
  --t-yes:#5fbf85; --t-maybe:#e2b84a; --t-sent:#86a9dc; --t-no:#d98078; --t-todo:rgba(246,239,220,.16);
  --g0:#2d5893; --g1:#2c7a4b; --g2:#a0700a; --g3:#9e3f38; --g4:#6b4fa0; --g5:#1f7a7a; --g6:#b0527a; --g7:#5f6574;
  --shadow:0 1px 0 rgba(21,34,63,.05), 0 10px 24px -16px rgba(21,34,63,.35);
  --scrim:rgba(15,22,40,.45);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1424; --surface:#172036; --surface-2:#1f2a44; --ink:#ece5d3; --muted:#a2a8b8; --line:#2a3552;
    --hero:#1a2747; --hero-ink:#f3ecd8; --hero-muted:#aab2c8; --hero-line:rgba(243,236,216,.2);
    --gold:#d9b553; --gold-ink:#e6c86e; --on-gold:#1d1604;
    --primary:#d9b553; --primary-ink:#141b2e;
    --c-yes:#7fd29f; --b-yes:#183527;
    --c-maybe:#e8c46a; --b-maybe:#3a2f12;
    --c-sent:#9dbbe8; --b-sent:#1c2c4a;
    --c-todo:#b3b8c5; --b-todo:#242e48;
    --c-no:#ec9a92; --b-no:#3d2024;
    --g0:#8fb0e3; --g1:#7fd29f; --g2:#e8c46a; --g3:#ec9a92; --g4:#bba3e6; --g5:#6ccaca; --g6:#e99cbd; --g7:#b3b8c5;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 24px -16px rgba(0,0,0,.6);
    --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1424; --surface:#172036; --surface-2:#1f2a44; --ink:#ece5d3; --muted:#a2a8b8; --line:#2a3552;
  --hero:#1a2747; --hero-ink:#f3ecd8; --hero-muted:#aab2c8; --hero-line:rgba(243,236,216,.2);
  --gold:#d9b553; --gold-ink:#e6c86e; --on-gold:#1d1604;
  --primary:#d9b553; --primary-ink:#141b2e;
  --c-yes:#7fd29f; --b-yes:#183527; --c-maybe:#e8c46a; --b-maybe:#3a2f12; --c-sent:#9dbbe8; --b-sent:#1c2c4a;
  --c-todo:#b3b8c5; --b-todo:#242e48; --c-no:#ec9a92; --b-no:#3d2024;
  --g0:#8fb0e3; --g1:#7fd29f; --g2:#e8c46a; --g3:#ec9a92; --g4:#bba3e6; --g5:#6ccaca; --g6:#e99cbd; --g7:#b3b8c5;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 24px -16px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Rubik,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hero)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none !important}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero);color:var(--hero-ink);display:flex;align-items:center;gap:10px;padding:10px 14px 10px 18px}
.brand{font:700 21px/1.1 "Frank Ruhl Libre",Georgia,"Times New Roman",serif;letter-spacing:.2px;margin:0;flex:1;min-width:0}
.brand small{display:block;font:400 12.5px/1.3 Rubik,system-ui,sans-serif;color:var(--hero-muted);margin-top:2px}
.sync{font-size:12.5px;color:var(--hero-muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--t-yes)}
.sync.saving::before{background:var(--t-maybe)}
.sync.off::before{background:var(--t-no)}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:inherit}
.top .iconbtn:hover{background:var(--hero-line)}

main{max-width:680px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.banner{max-width:680px;margin:12px auto 0;padding:0 16px}
.banner p{margin:0;background:var(--b-maybe);color:var(--c-maybe);border-radius:12px;padding:10px 14px;font-size:14.5px}
.loading{color:var(--muted);text-align:center;padding:48px 0}

.pagehead{display:flex;align-items:flex-end;gap:10px;margin:4px 0 14px}
.pagehead h1{font:900 30px/1.05 "Frank Ruhl Libre",Georgia,serif;margin:0;flex:1}
.pagehead h1 span{display:block;font:400 14px/1.4 Rubik,system-ui,sans-serif;color:var(--muted);margin-top:4px}
h2.sec{font:700 20px/1.2 "Frank Ruhl Libre",Georgia,serif;margin:28px 0 10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:15px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.btn.gold{background:var(--gold);color:var(--on-gold);border-color:transparent;font-weight:600}
.btn.quiet{background:transparent}
.btn.danger{color:var(--c-no);border-color:var(--b-no);background:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .i{width:18px;height:18px}
.linkbtn{border:0;background:none;padding:6px 0;color:var(--gold-ink);font-weight:500;text-decoration:underline;text-underline-offset:3px}

/* event cards */
.evlist{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.evcard{display:flex;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:0;overflow:hidden;color:inherit}
.stub{flex:none;width:74px;background:var(--hero);color:var(--hero-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 4px;border-right:2px dashed var(--bg)}
.stub b{font:900 32px/1 "Frank Ruhl Libre",Georgia,serif;color:var(--gold)}
.stub span{font-size:12.5px;color:var(--hero-muted);margin-top:4px}
.evbody{padding:13px 15px 14px;min-width:0;flex:1}
.evbody .ttl{display:block;margin:0;font:700 19px/1.2 "Frank Ruhl Libre",Georgia,serif}
.evbody .meta{display:block;margin:3px 0 0;color:var(--muted);font-size:14px}
.evbody .tl{margin:9px 0 0;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 12px}
.dot{display:inline-flex;align-items:center;gap:6px}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.k-yes{color:var(--c-yes)} .k-maybe{color:var(--c-maybe)} .k-sent{color:var(--c-sent)} .k-no{color:var(--c-no)} .k-todo{color:var(--c-todo)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:26px 20px;text-align:center}
.empty h2{font:700 21px/1.2 "Frank Ruhl Libre",Georgia,serif;margin:0 0 6px}
.empty p{margin:0 auto 16px;color:var(--muted);max-width:40ch}
.morelink{text-align:center;margin:18px 0 0}

/* event hero */
.evtop{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 10px}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);padding:8px 6px 8px 0;font-weight:500}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:18px 18px 18px;box-shadow:var(--shadow)}
.h-date{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--gold);font-weight:500;font-size:14.5px}
.chip{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;background:var(--hero-line);color:var(--hero-ink)}
.h-title{font:900 31px/1.08 "Frank Ruhl Libre",Georgia,serif;margin:6px 0 4px;overflow-wrap:anywhere}
.h-meta{margin:0;color:var(--hero-muted);font-size:15px}
.h-aud{margin:4px 0 0;color:var(--hero-muted);font-size:14px}
.headcount{display:flex;align-items:baseline;gap:10px;margin:16px 0 8px}
.headcount b{font:900 44px/1 "Frank Ruhl Libre",Georgia,serif;color:var(--gold)}
.headcount span{color:var(--hero-ink);font-size:15px;line-height:1.3}
.tally{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--t-todo);gap:2px}
.tally i{display:block;height:100%}
.tally .yes{background:var(--t-yes)} .tally .maybe{background:var(--t-maybe)} .tally .sent{background:var(--t-sent)} .tally .no{background:var(--t-no)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:10px 0 0;font-size:13.5px;color:var(--hero-ink)}
.legend .dot::before{width:9px;height:9px}
.legend .l-yes::before{background:var(--t-yes)} .legend .l-maybe::before{background:var(--t-maybe)} .legend .l-sent::before{background:var(--t-sent)} .legend .l-no::before{background:var(--t-no)} .legend .l-todo::before{background:var(--hero-muted)}
.h-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.h-actions .btn{flex:1 1 auto}
.hero .btn.quiet{color:var(--hero-ink);border-color:var(--hero-line)}
.camebox{margin-top:14px;padding-top:14px;border-top:1px solid var(--hero-line);font-size:14.5px;color:var(--hero-ink);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

.msgcard{margin:14px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.msgcard .txt{flex:1;min-width:0}
.msgcard .lbl{font-size:13px;color:var(--muted);margin:0 0 3px}
.msgcard .body{margin:0;font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}

/* filters */
.filters{display:flex;gap:8px;overflow-x:auto;margin:18px -16px 10px;padding:2px 16px 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--ink)}
.fchip b{font-weight:600}
.fchip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.fchip .gdot{width:9px;height:9px;border-radius:50%;background:var(--gc)}
.searchbar{margin:0 0 10px}
.searchbar input{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}

/* rows */
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{padding:11px 12px 11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .line1{display:flex;align-items:center;gap:8px}
.who{flex:1;min-width:0;text-align:left;border:0;background:none;padding:2px 0;color:inherit}
.nm{display:block;font-weight:500;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{display:block;font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.grow{flex:1}
.pill{position:relative;display:inline-flex;align-items:center;border-radius:99px;font-size:14px;font-weight:500}
.pill select{appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:7px 30px 7px 12px;border-radius:99px;color:inherit;font-weight:500;min-height:36px}
.pill .i{position:absolute;right:9px;width:15px;height:15px;pointer-events:none}
.st-todo{background:var(--b-todo);color:var(--c-todo)} .st-sent{background:var(--b-sent);color:var(--c-sent)} .st-yes{background:var(--b-yes);color:var(--c-yes)} .st-maybe{background:var(--b-maybe);color:var(--c-maybe)} .st-no{background:var(--b-no);color:var(--c-no)}
.party{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;font-size:14px}
.party button{border:0;background:none;width:34px;height:34px;font-size:18px;line-height:1;color:var(--ink)}
.party span{min-width:58px;text-align:center}
.came{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:transparent;font-size:14px;font-weight:500;color:var(--muted)}
.came .i{width:16px;height:16px}
.came[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:transparent}
.tbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:99px;background:var(--primary);color:var(--primary-ink);text-decoration:none}
.tbtn .i{width:19px;height:19px}
.ibtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:99px;border:1px solid var(--line);color:var(--ink);background:transparent;text-decoration:none}
.ibtn .i{width:18px;height:18px}
.nophone{font-size:13.5px;color:var(--c-no)}
.showmore{display:block;margin:12px auto 0}
.none{color:var(--muted);text-align:center;padding:18px 0}
.gchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.gtag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:99px;padding:1px 8px 1px 7px}
.gtag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gc)}
.prow{display:flex;align-items:center;gap:10px}
.prow .who{display:block}
.check{width:22px;height:22px;accent-color:var(--primary);flex:none}
.selbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;justify-content:center;padding:0 12px 10px;pointer-events:none}
.selbar div{pointer-events:auto;background:var(--hero);color:var(--hero-ink);border-radius:16px;box-shadow:var(--shadow);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:656px;width:100%}
.selbar b{flex:1 1 100%;font-weight:500;font-size:14.5px;padding:0 4px}
.selbar .btn{min-height:38px;font-size:14px;padding:0 12px;background:transparent;color:var(--hero-ink);border-color:var(--hero-line)}
.selbar .btn.gold{background:var(--gold);color:var(--on-gold)}

/* history */
.rank{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rank li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rank .n{font:700 22px/1 "Frank Ruhl Libre",Georgia,serif;color:var(--gold-ink);min-width:28px;text-align:center}
.rank .who{padding:0}
.hint{color:var(--muted);font-size:14.5px;margin:0 0 10px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:0 0 env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;max-width:200px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;color:var(--muted);font-size:12.5px;font-weight:500}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] .i{color:var(--gold-ink)}
.tabs .i{width:23px;height:23px}

/* sheets */
.sheet-root{position:fixed;inset:0;z-index:50;display:none}
.sheet-root.open{display:block}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));max-width:680px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 10px}
.sheet h2{font:700 24px/1.15 "Frank Ruhl Libre",Georgia,serif;margin:0 0 4px}
.sheet .lead{color:var(--muted);margin:0 0 14px;font-size:15px}
.shead{display:flex;align-items:flex-start;gap:8px}
.shead h2{flex:1}
.sheet h2.sec{margin:26px 0 10px}
.field{display:block;margin:0 0 14px}
.field > span{display:block;font-size:14px;font-weight:500;margin:0 0 6px}
.field input,.field textarea,.field select{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 13px;font-size:16px}
.field textarea{min-height:130px;resize:vertical;line-height:1.45}
.field small{display:block;color:var(--muted);font-size:13px;margin-top:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tog{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14.5px;color:var(--ink)}
.tog .gdot{width:9px;height:9px;border-radius:50%;background:var(--gc)}
.tog[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.tog[aria-pressed="true"] .gdot{box-shadow:0 0 0 2px var(--primary-ink)}
.sbtns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.sbtns .btn{flex:1}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.opt{display:flex;gap:13px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;color:inherit;font-size:15px}
.opt .i{width:24px;height:24px;color:var(--gold-ink)}
.opt b{display:block;font-weight:500;font-size:16px}
.filepick{position:relative;cursor:pointer;overflow:hidden}
.filepick input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:2}
.opt span{color:var(--muted);font-size:13.5px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14.5px;margin:0 0 14px}
.note ol{margin:6px 0 0;padding-left:20px}
.note li{margin:3px 0}
.preview{background:var(--surface-2);border-radius:16px 16px 16px 4px;padding:11px 14px;font-size:15px;white-space:pre-wrap;margin:6px 0 0;overflow-wrap:anywhere}
.ins{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 14px}
.ins button{border:1px dashed var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:13.5px;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;font-size:14px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.mini{list-style:none;margin:0;padding:0;font-size:14.5px}
.mini li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.mini li:first-child{border-top:0}
.mini .r{color:var(--muted);text-align:right}
.maprow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.glist{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.glist li{display:flex;gap:8px;align-items:center}
.glist input{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--gc);flex:none}
.results{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;max-height:46vh;overflow-y:auto}
.results li{border-top:1px solid var(--line)}
.results li:first-child{border-top:0}
.results button{width:100%;text-align:left;border:0;background:none;padding:11px 14px;display:flex;justify-content:space-between;gap:10px;color:inherit}

/* send flow */
.sendhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.left{font-size:14.5px;color:var(--muted)}
.left b{color:var(--ink);font-weight:600}
.scard{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.scard .who2{font:900 28px/1.1 "Frank Ruhl Libre",Georgia,serif;margin:0;overflow-wrap:anywhere}
.scard .ph{color:var(--hero-muted);margin:4px 0 12px;font-size:15px}
.scard .preview{background:rgba(246,239,220,.1);color:var(--hero-ink);max-height:34vh;overflow:auto}
.scard .btn.gold{width:100%;min-height:54px;font-size:17px;margin-top:16px}
.scard .warn{margin:10px 0 0;color:var(--t-maybe);font-size:14px}
.scard .btn.ghost{color:var(--hero-ink);border-color:var(--hero-line);background:transparent}
.scard .pair{display:flex;gap:8px;margin-top:10px}
.scard .pair .btn{flex:1;min-width:0}
.scard .failnote{margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--hero-line);font-size:14.5px;color:var(--hero-ink)}
.tip{margin:12px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14.5px}
.tip ol{margin:6px 0 10px;padding-left:20px}
.tip li{margin:3px 0}
.sdone{text-align:center;padding:10px 0}
.sdone b{display:block;font:900 52px/1 "Frank Ruhl Libre",Georgia,serif;color:var(--gold-ink)}
.who-pick{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 14px}
.who-pick .btn{flex:1}

.gate{max-width:440px;margin:28px auto 0;background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:30px 24px 26px;box-shadow:var(--shadow);text-align:center}
.gate h1{font:900 32px/1.08 "Frank Ruhl Libre",Georgia,serif;margin:0 0 10px;color:var(--hero-ink)}
.gate p{margin:0 auto 18px;color:var(--hero-muted);max-width:34ch}
.gate .btn{width:100%;min-height:52px;font-size:16px}
.gate .btn + .btn{margin-top:10px}
.gate .btn.quiet{color:var(--hero-ink);border-color:var(--hero-line)}
.gate .who{display:block;color:var(--gold);font-weight:500;margin:0 0 6px;word-break:break-all}
.gate .g{width:20px;height:20px;flex:none}
.gate .gsi{display:flex;justify-content:center;min-height:44px;margin:0 auto 6px;max-width:360px}
.gate .alt{display:block;margin:12px auto 0;color:var(--hero-muted);font-size:14px}
.gate .busy{color:var(--hero-ink);margin:6px 0 0}
.members{list-style:none;margin:0 0 12px;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.members li{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 14px;border-top:1px solid var(--line);font-size:15px;min-height:52px}
.members li:first-child{border-top:0}
.members .em{flex:1;min-width:0;overflow-wrap:anywhere}
.members .em small{display:block;color:var(--muted);font-size:13px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 68px);transform:translateX(-50%) translateY(-8px);z-index:60;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (min-width:560px){ .h-title{font-size:36px} }
@media (prefers-reduced-motion: reduce){ .sheet{animation:none} .toast{transition:none} }

<body>

  <button class="iconbtn" id="setbtn" type="button" data-act="settings" aria-label="Settings" hidden><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>

  <button type="button" data-act="tab" data-tab="people"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.3"/><path d="M3 19.5c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><path d="M15.5 5.6a3 3 0 0 1 0 5.8M17.5 14.8c1.8.6 3 2.2 3.5 4.7"/></svg><span>People</span></button>

<script src="config.js"></script>
<script>
(function(){
'use strict';

/* ---------------- Firebase connection ----------------
   These settings identify this app's Firebase project. They are meant to be public;
   what protects the data is the project's security rules (only approved Google
   accounts can read or write). */
const FIREBASE_CONFIG = window.FIREBASE_CONFIG || {};   /* set in config.js */
const GOOGLE_CLIENT_ID = window.GOOGLE_CLIENT_ID || '';  /* set in config.js; enables Google's own sign-in button */
const FB_SDK = 'https://www.gstatic.com/firebasejs/12.19.0/';

/* ---------------- icons ---------------- */
const sv = p => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + p + '</svg>';
const I = {
  plus: sv('<path d="M12 5v14M5 12h14"/>'),
  back: sv('<path d="M15 5l-7 7 7 7"/>'),
  caret: sv('<path d="M7 10l5 5 5-5"/>'),
  msg: sv('<path d="M20 12c0 3.9-3.6 7-8 7-1.1 0-2.2-.2-3.1-.6L4 19.5l1.3-3.4C4.5 14.9 4 13.5 4 12c0-3.9 3.6-7 8-7s8 3.1 8 7z"/>'),
  phone: sv('<path d="M5 4h3.5l1.5 4-2 1.3a11 11 0 0 0 6.7 6.7L16 14l4 1.5V19a1.5 1.5 0 0 1-1.6 1.5C10.6 20 4 13.4 3.5 5.6A1.5 1.5 0 0 1 5 4z"/>'),
  check: sv('<path d="M5 12.5l4.2 4.2L19 7"/>'),
  more: sv('<circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/>'),
  pencil: sv('<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>'),
  user: sv('<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.7-3.6 3.5-5.5 7-5.5s6.3 1.9 7 5.5"/>'),
  list: sv('<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>'),
  sheet: sv('<rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M4 9h16M4 14.5h16M10 9v11.5"/>'),
  card: sv('<rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2.3"/><path d="M5.5 16.5c.6-1.7 1.9-2.6 3.5-2.6s2.9.9 3.5 2.6M14.5 10h4M14.5 13.5h3"/>'),
  book: sv('<path d="M5 4.5h11a2 2 0 0 1 2 2V20H7a2 2 0 0 1-2-2V4.5z"/><path d="M5 18a2 2 0 0 1 2-2h11"/><circle cx="11.5" cy="9.5" r="2"/>'),
  tag: sv('<path d="M3.5 12.2V4.5h7.7l9 9-7.7 7.7-9-9z"/><circle cx="8" cy="9" r="1.3"/>'),
  copy: sv('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>'),
  trash: sv('<path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/>'),
  download: sv('<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/>'),
  share: sv('<circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.2 10.8l7.6-4.1M8.2 13.2l7.6 4.1"/>')
};

/* ---------------- small utils ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const uid = () => Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 8);
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
const uniq = a => Array.from(new Set(a));
const LS = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
function deepMerge(a, b){
  const out = Object.assign({}, isObj(a) ? a : {});
  for (const k in b) {
    if (!Object.prototype.hasOwnProperty.call(b, k)) continue;
    out[k] = (isObj(b[k]) && isObj(out[k])) ? deepMerge(out[k], b[k]) : b[k];
  }
  return out;
}
function hash(s){ let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
const SHARDS = 8;
const shardPath = id => 'book/c' + (hash(id) % SHARDS);
const byName = (a, b) => (a.n || '').localeCompare(b.n || '', undefined, {sensitivity:'base'});

/* phones */
function normPhone(raw){
  const s = String(raw || '').trim();
  if (!s) return '';
  const plus = s.charAt(0) === '+';
  const d = s.replace(/\D/g, '');
  if (!d) return '';
  if (plus) return '+' + d;
  if (d.length === 10) return '+1' + d;
  if (d.length === 11 && d.charAt(0) === '1') return '+' + d;
  return d;
}
const phoneKey = p => { const d = String(p || '').replace(/\D/g, ''); return d.length >= 10 ? d.slice(-10) : d; };
const validPhone = p => phoneKey(p).length >= 7;
function fmtPhone(p){
  const s = String(p || '');
  if (/^\+1\d{10}$/.test(s)) { const x = s.slice(2); return '(' + x.slice(0,3) + ') ' + x.slice(3,6) + '-' + x.slice(6); }
  return s;
}
const TITLES = /^(mr|mrs|ms|miss|dr|rabbi|rebbetzin|reb|cantor|prof)\.?$/i;
function greetName(c){
  if (c.fn && c.fn.trim()) return c.fn.trim();
  const t = String(c.n || '').trim().split(/\s+/).filter(Boolean);
  while (t.length > 1 && TITLES.test(t[0])) t.shift();
  if (t.length >= 3 && (t[1] === '&' || /^and$/i.test(t[1]))) return t[0] + ' & ' + t[2];
  return t[0] || 'there';
}

/* dates */
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function parseD(s){ const p = String(s || '').split('-').map(Number); return new Date(p[0], (p[1]||1) - 1, p[2] || 1); }
function dayDiff(s){ const a = parseD(todayStr()), b = parseD(s); return Math.round((b - a) / 86400000); }
function fmtLong(s){ return parseD(s).toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'}); }
function fmtShort(s){ const d = parseD(s); const o = {month:'short', day:'numeric'}; if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric'; return d.toLocaleDateString('en-US', o); }
function fmtMonth(s){ return parseD(s).toLocaleDateString('en-US', {month:'short'}); }
function fmtWeekday(s){ return parseD(s).toLocaleDateString('en-US', {weekday:'short'}); }
function relLabel(s){
  const n = dayDiff(s);
  if (n === 0) return 'Today';
  if (n === 1) return 'Tomorrow';
  if (n === -1) return 'Yesterday';
  if (n > 13) return 'In ' + Math.round(n / 7) + ' weeks';
  if (n > 1) return 'In ' + n + ' days';
  return (-n) + ' days ago';
}
function whenText(s){
  const n = dayDiff(s);
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  if (n > 1 && n < 7) return 'this ' + parseD(s).toLocaleDateString('en-US', {weekday:'long'});
  return 'on ' + fmtLong(s);
}
function relTime(ts){
  if (!ts) return '';
  const d = new Date(ts), now = new Date();
  const t = d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
  if (d.toDateString() === now.toDateString()) return 'today at ' + t;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return 'yesterday at ' + t;
  const o = {month:'short', day:'numeric'}; if (d.getFullYear() !== now.getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString('en-US', o);
}

/* ---------------- messages ---------------- */
const DEF_MSG = 'Hi {first}! You’re invited to {event} on {date} at {time}, {place}. We’d love to see you there. Can we count you in?';
const DEF_RMSG = 'Hi {first}! Just a reminder that {event} is {when} at {time}, {place}. Looking forward to seeing you!';
const FIELDS = [['first','First name'],['event','Event name'],['date','Date'],['when','“today” / “tomorrow”'],['time','Time'],['place','Place']];
function compose(tpl, c, ev){
  const vals = {
    first: greetName(c), event: (ev && ev.name) || 'our event',
    date: ev && ev.date ? fmtLong(ev.date) : '', when: ev && ev.date ? whenText(ev.date) : '',
    time: (ev && ev.time) || '', place: (ev && ev.place) || ''
  };
  return String(tpl || '')
    .replace(/\{(\w+)\}/g, (m, k) => Object.prototype.hasOwnProperty.call(vals, k) ? vals[k] : m)
    .replace(/[ \t]{2,}/g, ' ')
    .replace(/\b(at|on)\s*,/gi, ',')
    .replace(/,\s*([.!?,])/g, '$1')
    .replace(/ +([,.!?])/g, '$1')
    .replace(/\b(at|on)([.!?])/gi, '$2')
    .trim();
}
const smsHref = (c, text) => 'sms:' + encodeURIComponent(c.p).replace(/%2B/g, '+') + '?body=' + encodeURIComponent(text);
const APP_URL = location.origin + location.pathname;

/* Opening Messages or the phone app: try, then watch whether the phone actually left
   this screen. Only a real switch (or the person saying they sent it) counts as texted. */
let WATCH = null;
function stopWatch(){ if (WATCH) { WATCH.off(); WATCH = null; } }
function openApp(href, cb){
  stopWatch();
  let framed = true;
  try { framed = window.top !== window; } catch(e) { framed = true; }
  if (framed) {
    let w = null;
    try { w = window.open(href, '_blank'); } catch(e) { w = null; }
    if (!w) { cb('failed'); return; }
  } else {
    try { window.location.href = href; } catch(e) { cb('failed'); return; }
  }
  const me = {done:false};
  const left = () => { if (me.done) return; me.done = true; me.off(); if (WATCH === me) WATCH = null; cb('opened'); };
  const vis = () => { if (document.visibilityState === 'hidden') left(); };
  me.off = () => { document.removeEventListener('visibilitychange', vis); window.removeEventListener('blur', left); clearTimeout(me.t1); clearTimeout(me.t2); };
  document.addEventListener('visibilitychange', vis);
  window.addEventListener('blur', left);
  me.t1 = setTimeout(() => { if (!me.done) cb('failed'); }, 2500);
  me.t2 = setTimeout(() => { if (!me.done) { me.done = true; me.off(); if (WATCH === me) WATCH = null; } }, 30000);
  WATCH = me;
}
function copyText(text){
  let ok = false;
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    ok = document.execCommand('copy'); ta.remove();
  } catch(e) { ok = false; }
  if (ok) return Promise.resolve(true);
  try { if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(() => true, () => false); } catch(e) {}
  return Promise.resolve(false);
}

/* ---------------- state ---------------- */
const S = {
  raw: {}, ver: 0, ready: false,
  loaded: {book:false, meta:false, events:false}, firm: {book:false, meta:false, events:false},
  tab: ['events','people','history'].indexOf(LS.get('ci-tab')) > -1 ? LS.get('ci-tab') : 'events',
  eventId: null, evFilter: 'all', evSearch: '', evShow: 120,
  pGroup: 'all', pSearch: '', pShow: 150, selecting: false, sel: new Set(),
  hGroup: 'all',
  sheet: null, readOnly: false, offline: false, saving: 0, noDb: false,
  me: LS.get('ci-me') || '',
  auth: 'loading', user: null, members: null, isOwner: false, err: '',
  order: LS.get('ci-order') === 'za' ? 'za' : 'az'
};
const EXISTS = {};
const DELETED = new Set();
let DB = null, USER = null, DOWNLOADS = null;
let C = {ver: -1};

function D(){
  if (C.ver === S.ver) return C;
  const contacts = {};
  for (let i = 0; i < SHARDS; i++) {
    const d = S.raw['book/c' + i];
    if (d && isObj(d.c)) for (const id in d.c) { const c = d.c[id]; if (isObj(c) && c.n != null) contacts[id] = c; }
  }
  const list = Object.keys(contacts).map(id => Object.assign({id}, contacts[id])).sort(byName);
  const gRaw = (S.raw['meta/groups'] || {}).g || {};
  const groups = Object.keys(gRaw).filter(k => isObj(gRaw[k]) && gRaw[k].name).map(k => Object.assign({id:k}, gRaw[k]))
    .sort((a, b) => (a.o || 0) - (b.o || 0) || a.name.localeCompare(b.name));
  const gmap = {}; groups.forEach(g => { gmap[g.id] = g; });
  const events = Object.keys(S.raw).filter(p => p.indexOf('events/') === 0 && isObj(S.raw[p]) && S.raw[p].name)
    .map(p => Object.assign({id: p.slice(7)}, S.raw[p]))
    .sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.created || 0) - (b.created || 0));
  const byPhone = {}; list.forEach(c => { const k = phoneKey(c.p); if (k) byPhone[k] = c.id; });
  C = {ver: S.ver, contacts, list, groups, gmap, events, byPhone, settings: S.raw['meta/settings'] || {}};
  return C;
}
const contactGroups = c => (c.g || []).filter(g => D().gmap[g]);
const getEvent = id => { const r = S.raw['events/' + id]; return isObj(r) && r.name ? Object.assign({id}, r) : null; };
const gColor = g => 'var(--g' + ((g && g.color) || 0) % 8 + ')';

function audience(ev){
  const st = ev.st || {}, d = D(), gs = ev.groups || [];
  return d.list.filter(c => {
    const e = st[c.id];
    if (e && e.x) return false;
    if (ev.everyone) return true;
    if ((c.g || []).some(g => gs.indexOf(g) > -1 && d.gmap[g])) return true;
    return !!(e && (e.a || e.tx || e.r || e.came));
  });
}
function pstate(e){
  if (!e) return 'todo';
  if (e.r === 'yes' || e.r === 'maybe' || e.r === 'no') return e.r;
  return e.tx ? 'sent' : 'todo';
}
function counts(ev, aud){
  const st = ev.st || {};
  const k = {todo:0, sent:0, yes:0, maybe:0, no:0, head:0, came:0, total:0, rem:0};
  (aud || audience(ev)).forEach(c => {
    const e = st[c.id]; const s = pstate(e); k[s]++; k.total++;
    if (s === 'yes') k.head += Math.max(1, (e && e.n) || 1);
    if ((s === 'yes' || s === 'maybe') && !(e && e.rx) && validPhone(c.p)) k.rem++;
    if (e && e.came) k.came++;
  });
  return k;
}
const audLabel = ev => {
  if (ev.everyone) return 'Everyone on your list';
  const names = (ev.groups || []).map(g => D().gmap[g]).filter(Boolean).map(g => g.name);
  return names.length ? names.join(', ') : 'People you add by hand';
};

/* ---------------- saving ---------------- */
const Q = {};
function setSaving(n){ S.saving = Math.max(0, S.saving + n); paintSync(); }
function write(path, patch){
  if (S.readOnly) { toast('This list is view only for you.'); return false; }
  if (!DB) { toast('Not connected yet. Try again in a moment.'); return false; }
  DELETED.delete(path);
  S.raw[path] = deepMerge(S.raw[path], patch); S.ver++;
  const q = Q[path] || (Q[path] = {pending:null, inflight:null, busy:false});
  q.pending = q.pending ? deepMerge(q.pending, patch) : patch;
  if (!q.busy) flush(path);
  schedule();
  return true;
}
async function flush(path){
  const q = Q[path]; q.busy = true; setSaving(1);
  while (q.pending) {
    const p = q.pending; q.pending = null; q.inflight = p;
    for (let attempt = 0; attempt < 2; attempt++) {
      try { await sendPatch(path, p); break; }
      catch(e) {
        const code = e && e.code;
        if ((code === 'unavailable' || code === 'deadline_exceeded' || code === 'aborted') && attempt === 0) { await sleep(500 + Math.random() * 900); continue; }
        writeError(code); break;
      }
    }
    q.inflight = null;
  }
  q.busy = false; setSaving(-1);
}
async function sendPatch(path, p){
  const ref = DB.doc(path);
  try { await ref.update(p); EXISTS[path] = true; }
  catch(e) {
    if (e && e.code === 'invalid_argument' && !EXISTS[path]) { await ref.set(p); EXISTS[path] = true; return; }
    throw e;
  }
}
function writeError(code){
  if (code === 'resource_exhausted') toast('The app hit today’s free limit. Changes will work again tomorrow.');
  else if (code === 'permission_denied') { toast('That change didn’t save. This account no longer has access.'); S.auth = 'denied'; render(); }
  else if (code === 'invalid_argument') toast('That change didn’t save. It may be too large.');
  else toast('That change didn’t save. Check your connection and try again.');
}
async function removeDoc(path){
  if (!DB || S.readOnly) return;
  DELETED.add(path);
  delete S.raw[path]; S.ver++; schedule();
  const q = Q[path]; if (q) q.pending = null;
  while (q && q.busy) await sleep(120);
  try { await DB.doc(path).delete(); EXISTS[path] = false; }
  catch(e) { writeError(e && e.code); }
}
function applySnap(prefix, snap){
  const present = new Set();
  snap.docs.forEach(doc => {
    const path = prefix + '/' + doc.id;
    if (DELETED.has(path)) return;
    present.add(path); EXISTS[path] = true;
    let data = doc.data() || {};
    const q = Q[path];
    if (q && q.inflight) data = deepMerge(data, q.inflight);
    if (q && q.pending) data = deepMerge(data, q.pending);
    S.raw[path] = data;
  });
  Object.keys(S.raw).forEach(p => {
    if (p.indexOf(prefix + '/') === 0 && !present.has(p)) {
      const q = Q[p];
      if (q && (q.busy || q.pending)) return;
      delete S.raw[p];
      if (!snap.metadata.fromCache) EXISTS[p] = false;
    }
  });
  if (!snap.metadata.fromCache) S.firm[prefix] = true;
  S.loaded[prefix] = true;
  S.ver++;
  if (!S.ready && S.loaded.book && S.loaded.meta && S.loaded.events) S.ready = true;
  if (S.firm.book && S.firm.meta && S.firm.events) { clearTimeout(loadTimer); if (S.offline) { S.offline = false; paintBanner(); } }
  schedule();
}
let loadTimer = null;
function subscribe(prefix){
  DB.collection(prefix).onSnapshot(snap => applySnap(prefix, snap), err => {
    const code = err && err.code;
    if (code === 'permission_denied') { S.auth = 'denied'; render(); return; }
    if (code === 'unavailable') { S.offline = true; paintBanner(); setTimeout(() => subscribe(prefix), 4000); return; }
    S.loaded[prefix] = true; if (!S.ready && S.loaded.book && S.loaded.meta && S.loaded.events) S.ready = true;
    S.offline = true; paintBanner(); schedule();
  });
}

/* ---------------- render plumbing ---------------- */
let rq = false;
function schedule(){ if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; render(); if (S.sheet && S.sheet.live) renderSheet(); }); }
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), msg.length > 60 ? 6000 : 3200);

function paintSync(){

function renderEvent(ev){

/* ---------------- history ---------------- */
function renderHistory(){
  const d = D(), t = todayStr();
  const past = d.events.filter(e => e.date <= t).slice().reverse();
  let h = '<div class="pagehead"><h1>History</h1></div>';
  if (!past.length) return h + '<section class="empty"><h2>No past events yet</h2><p>After an event, mark who came. You’ll see your regulars here.</p></section>';
  h += '<ul class="evlist">' + past.slice(0, 40).map(ev => {
    const k = counts(ev);
    const bits = [];
    bits.push(k.came ? '<span class="dot k-yes">' + k.came + ' came</span>' : '<span class="dot k-todo">Attendance not marked</span>');
    if (k.yes) bits.push('<span class="dot k-maybe">' + k.yes + ' said they’d come</span>');
    const texted = Object.keys(ev.st || {}).filter(id => (ev.st[id] || {}).tx && d.contacts[id]).length;
    if (texted) bits.push('<span class="dot k-sent">' + texted + ' texted</span>');
    return '<li><button type="button" class="evcard" data-act="open-event" data-id="' + esc(ev.id) + '">'
      + '<span class="stub"><span>' + esc(fmtMonth(ev.date)) + '</span><b>' + parseD(ev.date).getDate() + '</b><span>' + parseD(ev.date).getFullYear() + '</span></span>'
      + '<span class="evbody"><span class="ttl">' + esc(ev.name) + '</span><span class="meta">' + esc(relLabel(ev.date)) + '</span><span class="tl">' + bits.join('') + '</span></span></button></li>';
  }).join('') + '</ul>';

  // attendance per person
  const stats = {};
  past.forEach(ev => {
    const st = ev.st || {};
    audience(ev).forEach(c => {
      const e = st[c.id];
      if (!e || !(e.tx || e.r || e.came)) return;
      const s = stats[c.id] || (stats[c.id] = {inv:0, came:0, last:''});
      s.inv++;
      if (e.came) { s.came++; if (!s.last) s.last = ev.name; }
    });
  });
  if (S.hGroup !== 'all' && !d.gmap[S.hGroup]) S.hGroup = 'all';
  const inG = c => S.hGroup === 'all' || (c.g || []).indexOf(S.hGroup) > -1;
  const people = d.list.filter(c => stats[c.id] && inG(c));
  const regulars = people.filter(c => stats[c.id].came).sort((a, b) => stats[b.id].came - stats[a.id].came || stats[a.id].inv - stats[b.id].inv || byName(a, b));
  const quiet = people.filter(c => !stats[c.id].came && stats[c.id].inv >= 3).sort((a, b) => stats[b.id].inv - stats[a.id].inv || byName(a, b));
  h += '<h2 class="sec">Who comes most</h2>';
  if (d.groups.length) h += '<div class="filters" role="group" aria-label="Group"><button type="button" class="fchip" data-act="hgroup" data-g="all" aria-pressed="' + (S.hGroup === 'all') + '">Everyone</button>'
    + d.groups.map(g => '<button type="button" class="fchip" data-act="hgroup" data-g="' + esc(g.id) + '" aria-pressed="' + (S.hGroup === g.id) + '" style="--gc:' + gColor(g) + '"><span class="gdot"></span>' + esc(g.name) + '</button>').join('') + '</div>';
  if (!regulars.length) h += '<p class="hint">Once you mark who came to an event, your regulars show up here.</p>';
  else h += '<ol class="rank">' + regulars.slice(0, 30).map(c => {
    const s = stats[c.id];
    return '<li><span class="n">' + s.came + '</span><button type="button" class="who" data-act="contact" data-id="' + esc(c.id) + '"><span class="nm">' + esc(c.n) + '</span><span class="sub">Came ' + plural(s.came, 'time') + ' out of ' + plural(s.inv, 'invite') + (s.last ? ', last to ' + esc(s.last) : '') + '</span></button></li>';
  }).join('') + '</ol>';
  if (quiet.length) {
    h += '<h2 class="sec">Invited often, hasn’t come yet</h2><p class="hint">A personal call might help with these.</p>'
      + '<ol class="rank">' + quiet.slice(0, 30).map(c => '<li><span class="n">' + stats[c.id].inv + '</span><button type="button" class="who" data-act="contact" data-id="' + esc(c.id) + '"><span class="nm">' + esc(c.n) + '</span><span class="sub">Invited ' + plural(stats[c.id].inv, 'time') + '</span></button>'
        + (validPhone(c.p) ? '<button type="button" class="ibtn" data-act="call" data-p="' + esc(c.p) + '" aria-label="Call ' + esc(c.n) + '">' + I.phone + '</button>' : '') + '</li>').join('') + '</ol>';
  }
  return h;
}

function parseVcf(text){
  text = String(text).replace(/\r\n?/g, '\n').replace(/\n[ \t]/g, '').replace(/=\n/g, '');

  text.split('\n').forEach(line => {
    const L = line.trim(); if (!L) return;
    if (/^BEGIN:VCARD/i.test(L)) { cur = {fn:'', n:'', tels:[]}; return; }
    if (/^END:VCARD/i.test(L)) {
      if (cur) {
        const tel = cur.tels.find(t => /CELL|MOBILE|IPHONE/.test(t.t)) || cur.tels[0];
        out.push({n: (cur.fn || cur.n || '').trim(), p: tel ? normPhone(tel.v) : ''});
      }
      cur = null; return;
    }
    if (!cur) return;
    const i = L.indexOf(':'); if (i < 0) return;
    const head = L.slice(0, i), val = L.slice(i + 1);
    const parts = head.split(';');
    const key = parts[0].toUpperCase().replace(/^ITEM\d+\./, '');
    const params = parts.slice(1).join(';').toUpperCase();
    const dec = v => {
      if (/QUOTED-PRINTABLE/.test(params)) v = decodeQP(v);
      return v.replace(/\\,/g, ',').replace(/\\;/g, ';').replace(/\\n/gi, ' ').trim();
    };
    if (key === 'FN') cur.fn = dec(val);
    else if (key === 'N') { const p = val.split(';').map(dec); cur.n = [p[1], p[2], p[0]].filter(Boolean).join(' '); }
    else if (key === 'TEL') cur.tels.push({v: dec(val), t: params});
  });
  return out;
}
function decodeQP(s){
  try {

    for (let i = 0; i < s.length; i++) {
      if (s[i] === '=' && /^[0-9A-Fa-f]{2}$/.test(s.substr(i + 1, 2))) { bytes.push(parseInt(s.substr(i + 1, 2), 16)); i += 2; }
      else bytes.push(s.charCodeAt(i) & 255);

  } catch(e) { return s; }
}
function parseCsv(text){

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(f); f = ''; }
    else if (ch === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (ch !== '\r') f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }

}

function buildTable(rows, sheets, sheetIdx){
  rows = rows.map(r => r.map(v => v == null ? '' : String(v)));
  const width = rows.reduce((m, r) => Math.max(m, r.length), 0);
  let hdr = -1;
  for (let i = 0; i < Math.min(6, rows.length); i++) {
    if (rows[i].some(v => /\b(name|phone|mobile|cell|first|last|tel|telephone|number|surname)\b/i.test(v) && !looksPhone(v))) { hdr = i; break; }
  }
  const letter = i => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  const cols = [];
  for (let i = 0; i < width; i++) cols.push(hdr > -1 && rows[hdr][i] && rows[hdr][i].trim() ? rows[hdr][i].trim() : 'Column ' + letter(i));
  const data = rows.slice(hdr + 1);
  const map = {name:-1, first:-1, last:-1, phone:-1};
  const find = re => cols.findIndex((c, i) => re.test(c) && !(map.phone === i));
  if (hdr > -1) {
    let p = cols.findIndex(c => /mobile|cell/i.test(c) && !/type|label/i.test(c));
    if (p < 0) p = cols.findIndex(c => /phone.*value/i.test(c));
    if (p < 0) p = cols.findIndex(c => /phone|tel|number/i.test(c) && !/type|label/i.test(c));
    map.phone = p;
    map.first = find(/^(first|given)(\s|_)?(name)?$|first name|given name/i);
    map.last = find(/^(last|family|surname)(\s|_)?(name)?$|last name|surname|family name/i);
    map.name = cols.findIndex(c => /^(full\s*name|name|display\s*name|contact\s*name|contact)$/i.test(c.trim()));
  }
  if (map.phone < 0) {
    let best = -1, bestN = 0;
    for (let i = 0; i < width; i++) { const n = data.filter(r => looksPhone(r[i])).length; if (n > bestN) { best = i; bestN = n; } }
    map.phone = best;
  }
  if (map.name < 0 && map.first < 0) {
    let best = -1, bestN = 0;
    for (let i = 0; i < width; i++) { if (i === map.phone) continue; const n = data.filter(r => /[A-Za-z\u0590-\u05FF]/.test(r[i] || '') && !looksPhone(r[i])).length; if (n > bestN) { best = i; bestN = n; } }

  return {rows: data, cols, map, sheets, sheetIdx: sheetIdx || 0};
}

    if (!n) n = [m.first > -1 ? r[m.first] : '', m.last > -1 ? r[m.last] : ''].map(s => (s || '').trim()).filter(Boolean).join(' ');

function parsePaste(text){
  const out = [];
  String(text || '').split(/\n/).forEach(line => {
    const L = line.trim(); if (!L) return;
    let m = L.match(/^(.*?)[\s,;\t]+(\+?\(?\d[\d\s().\-]{5,}\d)$/);
    if (m) { out.push({n: m[1].replace(/[,;\t]+$/, '').trim(), p: normPhone(m[2])}); return; }
    m = L.match(/^(\+?\(?\d[\d\s().\-]{5,}\d)[\s,;\t]+(.+)$/);

    out.push({n: L, p: ''});

}

    case 'sel-group-new': { const inp = $('#sheet [name="newgroup"]'); const g = newGroup(inp && inp.value); if (!g) { toast('Type a group name first.'); break; } const n = setGroupsFor(Array.from(S.sel), arr => uniq(arr.concat([g]))); toast('Added ' + plural(n, 'person', 'people') + '.'); closeSheet(); S.selecting = false; S.sel.clear(); render(); break; }
    case 'sel-ungroup-go': { const g = t.dataset.g; const name = (D().gmap[g] || {}).name; const n = setGroupsFor(Array.from(S.sel), arr => arr.filter(x => x !== g)); toast('Removed ' + plural(n, 'person', 'people') + ' from ' + name + '.'); closeSheet(); S.selecting = false; S.sel.clear(); render(); break; }
    case 'sel-delete': { const ids = Array.from(S.sel); openSheet({type:'confirm', title:'Delete ' + plural(ids.length, 'person', 'people') + '?', text:'They’ll be taken off your list and every event.', yes:'Delete', run(){ deleteContacts(ids); S.selecting = false; S.sel.clear(); toast('Deleted.'); }}); break; }
    case 'export': exportCsv(); break;
    case 'backup': saveFile('chabad-invites-backup-' + todayStr() + '.json', backupJson(), 'application/json'); break;
    case 'sign-in': signIn(); break;
    case 'sign-out':
      closeSheet();
      try { if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect(); } catch(e) {}
      if (FB) FB.AU.signOut(FB.auth).then(() => location.reload(), () => location.reload());
      break;
    case 'retry-access': checkAccess(); break;
    case 'reload': location.reload(); break;
    case 'member-add': {
      const inp = $('#sheet [name="newmember"]'); const v = String(inp && inp.value || '').trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { toast('Type a full email address, like name@gmail.com.'); break; }
      FB.F.updateDoc(FB.F.doc(FB.fs, 'access/members'), {emails: FB.F.arrayUnion(v)})
        .then(() => toast('Added ' + v + '. They can sign in now.'), () => toast('Couldn’t add them. Check your connection and try again.'));
      if (inp) inp.value = '';
      break;
    }
    case 'member-remove': {
      const v = t.dataset.e;
      openSheet({type:'confirm', title:'Remove ' + v + '?', text:'They won’t be able to open the list anymore. You can add them back later.', yes:'Remove', run(){
        FB.F.updateDoc(FB.F.doc(FB.fs, 'access/members'), {emails: FB.F.arrayRemove(v)}).then(() => toast('Removed.'), () => toast('Couldn’t remove them. Try again.'));
        setTimeout(() => openSheet({type:'settings'}), 50);
      }});
      break;
    }
  }
});
function keepForm(fn){
  const vals = {};
  document.querySelectorAll('#sheet [name]').forEach(el => { vals[el.name] = el.type === 'checkbox' ? el.checked : el.value; });
  fn();
  document.querySelectorAll('#sheet [name]').forEach(el => { if (vals[el.name] != null) { if (el.type === 'checkbox') el.checked = vals[el.name]; else el.value = vals[el.name]; } });
}
function updatePreview(){
  const sh = S.sheet, txt = $('#msgtext'), pv = $('#msgprev');
  if (!sh || !txt || !pv) return;
  const ev = sh.id ? getEvent(sh.id) : {name:'Chanukah Party', date: todayStr(), time:'7:30 PM', place:'the Chabad House'};
  pv.textContent = compose(txt.value, D().list[0] || {n:'Sarah Levine'}, ev);
}
document.addEventListener('change', e => {
  const t = e.target, a = t.dataset ? t.dataset.act : null, sh = S.sheet;
  if (a === 'status') { const ev = getEvent(S.eventId); if (ev) setStatus(ev, t.dataset.id, t.value); }
  else if (a === 'sel') { if (t.checked) S.sel.add(t.dataset.id); else S.sel.delete(t.dataset.id); renderSelbar(); }
  else if (a === 'r-pick') { sh.pick[t.dataset.i] = t.checked; refreshReview(); }
  else if (a === 'r-dupes') { sh.dupesToGroup = t.checked; }
  else if (a === 'map') { sh.table.map[t.dataset.k] = Number(t.value); sh.pick = {}; keepForm(() => renderSheet()); }
  else if (a === 'map-sheet') {
    const T = sh.table, i = Number(t.value);
    const nt = buildTable(T._all[i] || [], T.sheets, i); nt._all = T._all; sh.table = nt; sh.pick = {}; keepForm(() => renderSheet());
  }
  else if (a === 'g-name') { const v = t.value.trim(); if (v) write('meta/groups', {g: {[t.dataset.g]: {name: v}}}); }
  else if (t.id === 'f-backup' && t.files && t.files[0]) {
    t.files[0].text().then(txt => {
      let obj = null; try { obj = JSON.parse(txt); } catch(e) {}
      if (!obj || !isObj(obj.docs)) { toast('That isn’t a backup from this app.'); return; }
      const n = Object.keys(obj.docs).filter(p => BACKUP_PATH.test(p)).length;
      openSheet({type:'confirm', title:'Restore this backup?', text:'Everything in the backup replaces what’s in the app now: people, groups, events and history (' + n + ' saved parts).', yes:'Restore', run(){
        restoreBackup(obj).then(() => toast('Backup restored.'), () => toast('Couldn’t restore that backup.'));
      }});
    }, () => toast('Couldn’t read that file.'));
  }
  else if ((t.id === 'f-table' || t.id === 'f-vcf') && t.files && t.files[0]) {
    const f = t.files[0]; toast('Reading ' + (f.name || 'your file') + '…');
    readAnyFile(f).then(r => {
      if (r.vcf) {
        if (!r.vcf.length) { toast('No contacts found in that file.'); return; }
        openSheet({type:'review', recs: r.vcf, groups: [], from:'vcf'});
      } else openSheet({type:'review', table: r.table, groups: [], from:'table'});
    }).catch(() => toast(/\.(xlsx|xls)$/i.test(f.name || '') ? 'Couldn’t open that Excel file. Save it as .csv and choose it again.' : 'Couldn’t read that file.'));
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'psearch') { S.pSearch = t.value; S.pShow = 150; render(); }
  else if (t.id === 'evsearch') { S.evSearch = t.value; S.evShow = 120; render(); }
  else if (t.id === 'msgtext') updatePreview();
  else if (t.id === 'rsearch' && S.sheet) { S.sheet.rq = t.value; const l = $('#rlist'); if (l) l.innerHTML = reviewList(S.sheet); }
  else if (t.id === 'addsearch' && S.sheet) { S.sheet.q = t.value; const ev = getEvent(S.sheet.id); const r = $('#addresults'); if (r && ev) r.innerHTML = addResults(S.sheet, ev); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.name === 'newmember') { e.preventDefault(); const b = document.querySelector('#sheet [data-act="member-add"]'); if (b) b.click(); return; }
  if (e.key === 'Escape' && S.sheet) { closeSheet(); render(); }
  if (e.key === 'Enter' && e.target && e.target.name === 'newgroup' && S.sheet) {
    e.preventDefault();
    const map = {event:'ev-newgroup', contact:'c-newgroup', review:'r-newgroup', groups:'g-add', pickGroup:'sel-group-new'};
    const b = document.querySelector('#sheet [data-act="' + map[S.sheet.type] + '"]'); if (b) b.click();
  }
});

/* ---------------- start ---------------- */
let FB = null;
const mapCode = c => String(c || 'unknown').replace(/^firestore\//, '').replace(/-/g, '_');
const wrapErr = e => { throw {code: mapCode(e && e.code), message: e && e.message}; };
function stripNulls(o){
  const out = {};
  Object.keys(o).forEach(k => { const v = o[k]; out[k] = v === null ? FB.F.deleteField() : isObj(v) ? stripNulls(v) : v; });
  return out;
}
function makeDb(){
  const F = FB.F, fs = FB.fs;
  return {
    doc(path){ const ref = F.doc(fs, path); return {
      update: p => F.setDoc(ref, stripNulls(p), {merge: true}).catch(wrapErr),
      set: p => F.setDoc(ref, stripNulls(p), {merge: true}).catch(wrapErr),
      delete: () => F.deleteDoc(ref).catch(wrapErr)
    }; },
    collection(prefix){ return { onSnapshot(cb, err){
      return F.onSnapshot(F.collection(fs, prefix), snap => cb({
        docs: snap.docs.map(d => ({id: d.id, data: () => d.data(), metadata: d.metadata})),
        metadata: snap.metadata
      }), e => { if (err) err({code: mapCode(e && e.code), message: e && e.message}); });
    } }; }
  };
}
/* Sign-in.
   Preferred: Google Identity Services ("Sign in with Google" button / account picker).
   It hands the app a Google ID token directly, which works on Android Chrome, where the
   Firebase popup/redirect hand-off between two sites is often blocked.
   Fallback: Firebase's popup (fine on computers). No redirect flow: it fails on browsers
   that partition third-party storage. */
let GSI_LOAD = null, GSI_INIT = false;
const useGsi = () => !!GOOGLE_CLIENT_ID && !S.gsiFailed;
function loadGsi(){
  if (window.google && google.accounts && google.accounts.id) return Promise.resolve();
  if (GSI_LOAD) return GSI_LOAD;
  GSI_LOAD = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    const t = setTimeout(() => rej(new Error('timeout')), 10000);
    s.onload = () => { clearTimeout(t); (window.google && google.accounts && google.accounts.id) ? res() : rej(new Error('no gsi')); };
    s.onerror = () => { clearTimeout(t); rej(new Error('load failed')); };
    document.head.appendChild(s);
  });
  return GSI_LOAD;
}
function mountGsi(){
  if (!useGsi() || !document.getElementById('gsi-btn')) return;
  loadGsi().then(() => {
    const el = document.getElementById('gsi-btn');
    if (!el || S.auth !== 'out') return;
    if (!GSI_INIT) {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID, callback: onGsi, auto_select: false, cancel_on_tap_outside: true,
        context: 'signin', ux_mode: 'popup', itp_support: true, use_fedcm_for_prompt: true, use_fedcm_for_button: true
      });
      GSI_INIT = true;
    }
    const w = Math.round(Math.max(220, Math.min(360, el.clientWidth || 300)));
    google.accounts.id.renderButton(el, {type: 'standard', theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', logo_alignment: 'center', width: w});
    if (!S.promptShown) { S.promptShown = true; try { google.accounts.id.prompt(); } catch(e) {} }
  }, () => { S.gsiFailed = true; render(); });
}
function onGsi(resp){
  if (!resp || !resp.credential || !FB) return;
  S.signingIn = true; render();
  FB.AU.signInWithCredential(FB.auth, FB.AU.GoogleAuthProvider.credential(resp.credential))
    .catch(e => { S.signingIn = false; render(); authError(e); });
}
async function signIn(){
  if (!FB) return;
  const provider = new FB.AU.GoogleAuthProvider();
  provider.setCustomParameters({prompt: 'select_account'});
  try { await FB.AU.signInWithPopup(FB.auth, provider); }
  catch(e) { authError(e); }
}
function authError(e){
  const c = (e && e.code) || '';
  if (!c || c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request' || c === 'auth/user-cancelled') return;
  const code = ' (' + c.replace(/^auth\//, '') + ')';
  if (c === 'auth/unauthorized-domain') toast('This web address isn’t approved for sign-in yet' + code + '.');
  else if (c === 'auth/operation-not-allowed') toast('Google sign-in isn’t turned on for this app yet' + code + '.');
  else if (c === 'auth/network-request-failed') toast('Couldn’t reach Google. Check your connection and try again' + code + '.');
  else if (c === 'auth/popup-blocked') toast('The sign-in window was blocked. Allow pop-ups for this site and try again' + code + '.');
  else toast('Sign-in didn’t work' + code + '. Please try again.');
}
let started = false;
async function checkAccess(){
  S.auth = 'loading'; render();
  const F = FB.F, ref = F.doc(FB.fs, 'access/members');
  let snap = null;
  try { snap = await F.getDoc(ref); }
  catch(e) {
    const c = mapCode(e && e.code);
    if (c === 'permission_denied') { S.auth = 'denied'; render(); return; }
    try { snap = await F.getDocFromCache(ref); }
    catch(e2) { S.auth = 'error'; S.err = 'Can’t reach your saved list. Check your internet connection and reload.'; render(); return; }
  }
  if (!snap.exists()) {
    try { await F.setDoc(ref, {owner: S.user.email, emails: [S.user.email]}); }
    catch(e) { S.auth = 'denied'; render(); return; }
  }
  startApp();
}
function startApp(){
  S.auth = 'in';
  if (started) { render(); return; }
  started = true;
  DB = makeDb(); paintSync();
  FB.F.onSnapshot(FB.F.doc(FB.fs, 'access/members'), d => {
    S.members = d.exists() ? d.data() : null;
    S.isOwner = !!(S.members && S.user && S.members.owner === S.user.email);
    schedule();
  }, e => { if (mapCode(e && e.code) === 'permission_denied') { S.auth = 'denied'; render(); } });
  loadTimer = setTimeout(() => {
    if (!(S.firm.book && S.firm.meta && S.firm.events)) { S.offline = true; S.ready = true; paintBanner(); render(); }
  }, 10000);
  ['book','meta','events'].forEach(subscribe);
  render();
}
render();
(async function init(){
  if (!FIREBASE_CONFIG.apiKey) { S.auth = 'config'; render(); return; }
  let mods;
  try { mods = await Promise.all([import(FB_SDK + 'firebase-app.js'), import(FB_SDK + 'firebase-auth.js'), import(FB_SDK + 'firebase-firestore.js')]); }
  catch(e) { S.auth = 'error'; S.err = 'Couldn’t load the app. Check your internet connection and reload.'; render(); return; }
  const [A, AU, F] = mods;
  const app = A.initializeApp(FIREBASE_CONFIG);
  let fs;
  try { fs = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})}); }
  catch(e) { fs = F.getFirestore(app); }
  FB = {AU, F, fs, auth: AU.getAuth(app)};
  AU.onAuthStateChanged(FB.auth, user => {
    if (!user) { S.auth = 'out'; S.user = null; render(); return; }
    S.signingIn = false;
    S.user = {email: String(user.email || '').toLowerCase(), name: user.displayName || ''};
    if (S.auth !== 'in') checkAccess();
  });
})();
})();
</script>
